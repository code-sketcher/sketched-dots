#_______________________________________________               _____________________________________________
#_______________________________________________GENERAL OPTIONS_____________________________________________


set -g default-terminal "tmux-256color"
# `set -as` appends a fresh entry on every reload, so drop back to tmux's defaults first
set -gu terminal-features
set -as terminal-features ",xterm*:Tc:extkeys"
set -as terminal-features ",*:hyperlinks"

set -g monitor-activity off      # long-running panes flag constantly, so the marker carries no signal
set -g visual-activity off       # but don't show a message for it

# If mouse is on hyperlinks are not working
set -g mouse on

# Start counting windows with 1.
set -g base-index 1
setw -g pane-base-index 1

set -g renumber-windows on    # renumber windows
setw -g automatic-rename on   # rename window to current program
# An agent pane titles itself "<glyph> <topic>"; show that topic as the window name so the
# tab tracks the live conversation and follows pane switches, with +N for the other panes.
setw -g automatic-rename-format '#{?#{m/r:^[^A-Za-z0-9]+ ,#{pane_title}},#{s/^[^ ]* //:pane_title},#{?pane_in_mode,[tmux],#{pane_current_command}}}#{?#{>:#{window_panes},1}, +#{e|-|:#{window_panes},1},}'
set -g allow-rename on
set -g focus-events on
set -g set-titles on          # set terminal title

set -s escape-time 0          # faster command sequences
set -s set-clipboard on
set -s extended-keys on

set -g history-limit 5000     # boost history
set -g allow-passthrough on
setw -g aggressive-resize on  # Super useful when using "grouped sessions" and multi-monitor setup

#______________________________________________                   __________________________________________
#______________________________________________END GENERAL OPTIONS__________________________________________


#______________________________________________        _____________________________________________________
#______________________________________________BINDINGS_____________________________________________________

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf sourced"

bind -n Home send Escape "OH"
bind -n End send Escape "OF"

bind -n M-t display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch" # ALT T

bind s choose-tree -Zs -F '#{?pane_format,#[fg=themelightgrey]#{pane_current_command}  #[fg=themewhite]#{pane_title},#{?window_format,#[fg=themeblue]#{window_name}#{?window_active,#[fg=themegreen]  ●,},#[fg=themelightgrey]#{session_windows} windows#{?session_attached,#[fg=themegreen]  ● attached,}}}'

#windows
unbind t
bind t new-window
unbind x
bind W kill-window
bind w kill-pane

# split panes using | and _
bind | split-window -h
bind _ split-window -v
unbind '"'
unbind %

# Vim-like pane navigation: C-h/j/k/l and C-\ are bound by vim-tmux-navigator,
# which forwards the key to nvim when the pane runs it. prefix + C-l clears the screen.

# Switch between windows with Ctrl+Shift+H/L
bind -n 'C-S-l' select-window -n
bind -n 'C-S-h' select-window -p
bind -n 'C-S-L' select-window -n
bind -n 'C-S-H' select-window -p

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection

if-shell 'uname | grep -q Darwin' {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
} {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
}

#______________________________________________            _________________________________________________
#______________________________________________END BINDINGS_________________________________________________


#______________________________________________      _______________________________________________________
#______________________________________________COLORS_______________________________________________________
# %hidden keeps the palette out of the global environment, so it does not leak into every shell.
%hidden black='#21252b'
%hidden grey_dark='#3e4451'
%hidden grey='#4b5263'
%hidden grey_light='#5c6370'
%hidden white='#abb2bf'
%hidden red='#e06c75'
%hidden orange='#d19a66'
%hidden yellow='#e5c07b'
%hidden green='#98c379'
%hidden cyan='#56b6c2'
%hidden blue='#61afef'
%hidden purple='#c678dd'

# tmux 3.8 draws its own UI (tree, popups, menus, copy mode) in theme colours, not the terminal palette.
# Detection reports "light" under Ghostty, which would switch to the light-theme-* set.
set -s theme dark
set -s dark-theme-black $black
set -s dark-theme-white $white
set -s dark-theme-dark-grey $grey_dark
set -s dark-theme-light-grey $grey_light
set -s dark-theme-red $red
set -s dark-theme-green $green
set -s dark-theme-yellow $yellow
set -s dark-theme-blue $blue
set -s dark-theme-cyan $cyan
set -s dark-theme-magenta $purple

set -g @text_dark $black
set -g @text_white $white

set -g @session_bg $grey_dark
set -g @session_icon_fg $green

set -g @active_tab_bg_1 $cyan

set -g @inactive_tab_bg_1 $grey_light
set -g @inactive_tab_fg $white

set -g @user_icon_fg $cyan

set -g @zoom_icon_fg $cyan
set -g @bell_icon_fg $red
set -g @silence_icon_fg $grey_light
set -g @marked_icon_fg $purple
set -g @prefix_icon_fg $yellow
set -g @mode_icon_fg $purple
set -g @sync_icon_fg $red

set -g @active_pane_border $green
set -g @inactive_pane_border $grey_dark
#____________________________________________          _____________________________________________________
#____________________________________________END COLORS_____________________________________________________


#________________________________________________     ______________________________________________________
#________________________________________________STYLE______________________________________________________

set -g status-position top
set -g status-style 'fg=#{@text_white}'
set -g status-interval 2

# A flag must not restyle the whole tab; the icon carries it.
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default

set -g @agent-status-current-session-only "false"
set -g @agent-status-attention-color "#[fg=$red,bold]"
set -g @agent-status-working-color "#[fg=$yellow]"
set -g @agent-status-done-color "#[fg=$green]"

# Both icon sets nest formats inside an option value, so they must be read back with #{E:...}.
set -g @window_flag_icons '#{?window_zoomed_flag,#[fg=#{@zoom_icon_fg}] 󰍉,}#{?window_bell_flag,#[fg=#{@bell_icon_fg}] 󰂞,}#{?window_silence_flag,#[fg=#{@silence_icon_fg}] 󰂛,}#{?window_marked_flag,#[fg=#{@marked_icon_fg}] 󰐃,}'

set -g @mode_icons '#{?client_prefix,#[fg=#{@prefix_icon_fg}]󰘳 ,}#{?pane_in_mode,#[fg=#{@mode_icon_fg}]󰆏 ,}#{?pane_synchronized,#[fg=#{@sync_icon_fg}]󰓦 ,}'

# U+E0CA / U+E0C8 — Powerline Extra caps, ice-waveform edge; tmux expands \u escapes inside double quotes.
set -g @tab_sep_left ""
set -g @tab_sep_right ""

# U+E0B6 / U+E0B4 — Powerline Extra rounded caps for the session pill.
set -g @pill_left ""
set -g @pill_right ""

set -g status-right-length 0
set -g status-right '   #{E:@mode_icons}#(~/.config/tmux/plugins/tmux-agent-status/scripts/agent_status.sh)#[fg=#{@user_icon_fg}]  #(~/.config/tmux/scripts/user_host.sh #{pane_tty})'

set -g status-left-length 0
set -g status-left '#[bg=default,fg=#{@session_bg}]#{@pill_left}#[bg=#{@session_bg},fg=#{@session_icon_fg}]󰞷 #[fg=#{@text_white}]#S#[bg=default,fg=#{@session_bg}]#{@pill_right}  '

# Shown when the tabs overflow the bar; nf-md-chevron_double_left / _right.
set -g @overflow_left "#[fg=themelightgrey]\U000F013D "
set -g @overflow_right "#[fg=themelightgrey] \U000F013E"

# tmux 3.8's default status line with only the overflow markers swapped for the icons above.
set -g status-format[0] '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#{E:@overflow_left}#[list=right-marker]#{E:@overflow_right}#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

set -g window-status-current-format '#[bg=default,fg=#{@active_tab_bg_1}]#{@tab_sep_left}#[bg=#{@active_tab_bg_1},fg=#{@text_dark}]#I#[bg=default, fg=#{@active_tab_bg_1}]#{@tab_sep_right} #[fg=#{@text_white},bold]#W#[nobold]#{E:@window_flag_icons} '

set -g window-status-format '#[bg=default, fg=#{@inactive_tab_bg_1}]#{@tab_sep_left}#[bg=#{@inactive_tab_bg_1},fg=#{@text_white}]#I#[bg=default, fg=#{@inactive_tab_bg_1}]#{@tab_sep_right} #[fg=#{@inactive_tab_fg}]#W#{E:@window_flag_icons} '

set -g pane-active-border-style '#{?pane_in_mode,fg=themeyellow,#{?synchronize-panes,fg=themered,fg=#{@active_pane_border}}}'
set -g pane-border-style 'fg=#{@inactive_pane_border}'

set -g popup-style 'bg=default,fg=themewhite'
set -g popup-border-style 'bg=default,fg=themeblue'

set -g mode-style 'bg=themedarkgrey,fg=themeblue,bold'
set -g message-style 'bg=default,fg=themeyellow'
set -g message-command-style 'bg=default,fg=themeblue'

set -g tree-mode-border-style 'bg=default,fg=themelightgrey'
set -g tree-mode-preview-style 'fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},themegreen,themeblue}'

#______________________________________________         ____________________________________________________
#______________________________________________END STYLE____________________________________________________


#____________________________________________            ___________________________________________________
#____________________________________________TMUX-FZF-LINKS_________________________________________________

set -g @fzf-links-fzf-display-options "-w 50% -h 50% --maxnum-displayed 20 --multi --track --no-preview"
set -g @fzf-links-editor-open-cmd "tmux new-window -n 'nvim' nvim +%line '%file'"

if-shell 'uname | grep -q Darwin' {
  set -g @fzf-links-browser-open-cmd "open '%url'"
} {
  set -g @fzf-links-browser-open-cmd "xdg-open '%url'"
}

#__________________________________________                _________________________________________________
#__________________________________________END TMUX-FZF-LINKS_______________________________________________


#____________________________________________          _____________________________________________________
#____________________________________________PLUGINS________________________________________________________

set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'alberti42/tmux-fzf-links'
set -g @plugin 'christoomey/vim-tmux-navigator'
# macOS /usr/bin/grep is ugrep, which never matches the plugin's default `(\S+/)?` prefix
# against `nvim`, so C-h/j/k/l moved tmux panes instead of reaching nvim. `(.*/)?` works.
set -g @vim_navigator_pattern '(.*/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

run-shell ~/.config/tmux/plugins/tmux-agent-status/tmux-agent-status.tmux

run -b '~/.config/tmux/plugins/tpm/tpm'
