# herdr configuration
# Managed by sketched-dots (symlinked to ~/.config/herdr/config.toml)

onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
pane_borders = true
pane_gaps = true
tab_bar_position = "top"

[keys]
# Split panes using | and _ (matching tmux config)
split_vertical = "prefix+|"
split_horizontal = "prefix+_"

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
